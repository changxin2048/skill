<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&amp;family=Liu+Jian+Mao+Cao&amp;display=swap');
    .text { font-family: 'ZCOOL KuaiLe','Liu Jian Mao Cao','Kaiti SC','STKaiti','KaiTi','Comic Sans MS','Bradley Hand',cursive; }
    .shapes { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- 本次随机参数：纸色=浅米 #F5F1E8；结构色=燕麦 #EDE4D4/#A8967A（1950s-1980s）+ 灰蓝 #E3E8EB/#8C9AA3（1990s-2010s）；强调色=宝蓝 #2F6FA8/浅档#DCE5F2（2020s 大模型时代=重点模块）；墨色=暖墨 #3B3A36；seedA=57/scaleA=3.0/freq0.06；seedB=129/scaleB=4.2/freq0.052；排线=30°/opacity0.10；装饰=四角星+螺旋+标题波浪线；主流程=左侧垂直箭头+实心编号圆 -->
  <defs>
    <filter id="sketchA" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchB" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.052" numOctaves="3" seed="129" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="paperDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#D6D1C4" opacity="0.45"/>
    </pattern>
    <pattern id="hatchOat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#A8967A" stroke-width="1" opacity="0.10"/>
    </pattern>
    <pattern id="hatchSlate" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8C9AA3" stroke-width="1" opacity="0.10"/>
    </pattern>
    <pattern id="hatchBlue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2F6FA8" stroke-width="1" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- 纸张背景：浅米底 + 点阵 -->
  <rect width="1100" height="960" fill="#F5F1E8"/>
  <rect width="1100" height="960" fill="url(#paperDots)"/>

  <!-- ================= 形状组 A（sketchA 抖动）：容器底/第一遍描边、排线、内部小块、涂鸦 ================= -->
  <g filter="url(#sketchA)" class="shapes">
    <!-- C1 1950s 起步期 -->
    <rect x="40" y="130" width="1010" height="92" rx="14" fill="#EDE4D4" stroke="#A8967A" stroke-width="3"/>
    <rect x="40" y="130" width="1010" height="92" rx="14" fill="url(#hatchOat)"/>
    <!-- C2 1960s-70s 探索与寒冬 -->
    <rect x="40" y="274" width="1010" height="92" rx="14" fill="#EDE4D4" stroke="#A8967A" stroke-width="3"/>
    <rect x="40" y="274" width="1010" height="92" rx="14" fill="url(#hatchOat)"/>
    <!-- C3 1980s 复苏期 -->
    <rect x="40" y="418" width="1010" height="92" rx="14" fill="#EDE4D4" stroke="#A8967A" stroke-width="3"/>
    <rect x="40" y="418" width="1010" height="92" rx="14" fill="url(#hatchOat)"/>
    <!-- C4 1990s 统计学习 -->
    <rect x="40" y="562" width="1010" height="92" rx="14" fill="#E3E8EB" stroke="#8C9AA3" stroke-width="3"/>
    <rect x="40" y="562" width="1010" height="92" rx="14" fill="url(#hatchSlate)"/>
    <!-- C5 2010s 深度学习爆发 -->
    <rect x="40" y="706" width="1010" height="92" rx="14" fill="#E3E8EB" stroke="#8C9AA3" stroke-width="3"/>
    <rect x="40" y="706" width="1010" height="92" rx="14" fill="url(#hatchSlate)"/>
    <!-- C6 2020s 大模型时代（重点模块：强调色浅档填充 + 强调色全彩描边） -->
    <rect x="40" y="850" width="1010" height="92" rx="14" fill="#DCE5F2" stroke="#2F6FA8" stroke-width="3.2"/>
    <rect x="40" y="850" width="1010" height="92" rx="14" fill="url(#hatchBlue)"/>

    <!-- 内部小块（里程碑卡片，近白纸色 + 容器结构色描边） -->
    <!-- C1 -->
    <rect x="92" y="178" width="160" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <rect x="266" y="178" width="150" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <rect x="430" y="178" width="190" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <!-- C2 -->
    <rect x="92" y="322" width="165" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <rect x="271" y="322" width="185" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <rect x="470" y="322" width="160" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <!-- C3 -->
    <rect x="92" y="466" width="160" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <rect x="266" y="466" width="180" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <rect x="460" y="466" width="175" height="34" rx="8" fill="#FDFBF6" stroke="#A8967A" stroke-width="2"/>
    <!-- C4 -->
    <rect x="92" y="610" width="185" height="34" rx="8" fill="#FDFBF6" stroke="#8C9AA3" stroke-width="2"/>
    <rect x="291" y="610" width="170" height="34" rx="8" fill="#FDFBF6" stroke="#8C9AA3" stroke-width="2"/>
    <rect x="475" y="610" width="175" height="34" rx="8" fill="#FDFBF6" stroke="#8C9AA3" stroke-width="2"/>
    <!-- C5 -->
    <rect x="92" y="754" width="170" height="34" rx="8" fill="#FDFBF6" stroke="#8C9AA3" stroke-width="2"/>
    <rect x="276" y="754" width="175" height="34" rx="8" fill="#FDFBF6" stroke="#8C9AA3" stroke-width="2"/>
    <rect x="465" y="754" width="160" height="34" rx="8" fill="#FDFBF6" stroke="#8C9AA3" stroke-width="2"/>
    <rect x="639" y="754" width="185" height="34" rx="8" fill="#FDFBF6" stroke="#8C9AA3" stroke-width="2"/>
    <!-- C6（重点模块内部小块：强调色 60% 透明度描边） -->
    <rect x="92" y="898" width="165" height="34" rx="8" fill="#FDFBF6" stroke="#2F6FA8" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="271" y="898" width="180" height="34" rx="8" fill="#FDFBF6" stroke="#2F6FA8" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="465" y="898" width="175" height="34" rx="8" fill="#FDFBF6" stroke="#2F6FA8" stroke-opacity="0.6" stroke-width="2"/>

    <!-- 涂鸦装饰（强调色）：四角星 + 小螺旋 + 标题波浪下划线 -->
    <path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12 Z"
          transform="translate(82,104) scale(0.85)" fill="#2F6FA8" opacity="0.85"/>
    <path d="m0,0 c4,-6 12,-4 13,2 c1,6 -6,9 -11,5 c-4,-3 -4,-9 1,-11 c4,-2 8,1 7,5"
          transform="translate(1022,108)" fill="none" stroke="#2F6FA8" stroke-width="2"/>
    <path d="M458,58 C473,52 488,64 503,58 C518,52 533,64 548,58 C563,52 578,64 593,58 C608,52 623,64 638,58"
          fill="none" stroke="#2F6FA8" stroke-width="2.5"/>
  </g>

  <!-- ================= 描边组 B（sketchB 抖动，seed 不同 → 与第一遍错开形成叠线） ================= -->
  <g filter="url(#sketchB)" class="shapes">
    <rect x="40" y="130" width="1010" height="92" rx="14" fill="none" stroke="#A8967A" stroke-width="1.6"/>
    <rect x="40" y="274" width="1010" height="92" rx="14" fill="none" stroke="#A8967A" stroke-width="1.6"/>
    <rect x="40" y="418" width="1010" height="92" rx="14" fill="none" stroke="#A8967A" stroke-width="1.6"/>
    <rect x="40" y="562" width="1010" height="92" rx="14" fill="none" stroke="#8C9AA3" stroke-width="1.6"/>
    <rect x="40" y="706" width="1010" height="92" rx="14" fill="none" stroke="#8C9AA3" stroke-width="1.6"/>
    <rect x="40" y="850" width="1010" height="92" rx="14" fill="none" stroke="#2F6FA8" stroke-width="1.8"/>
  </g>

  <!-- ================= 连接线组（无滤镜，保持清晰）：主流程箭头 + 实心编号圆 ================= -->
  <g class="shapes">
    <!-- 主流程垂直箭头（轻微 S 形曲线，强调色） -->
    <path d="M70,222 C71.5,235 68.5,253 70,266" stroke="#2F6FA8" stroke-width="2" fill="none"/>
    <path d="M62,266 L78,267 L70,274 Z" fill="#2F6FA8"/>
    <path d="M70,366 C71.5,379 68.5,397 70,410" stroke="#2F6FA8" stroke-width="2" fill="none"/>
    <path d="M62,410 L78,411 L70,418 Z" fill="#2F6FA8"/>
    <path d="M70,510 C71.5,523 68.5,541 70,554" stroke="#2F6FA8" stroke-width="2" fill="none"/>
    <path d="M62,554 L78,555 L70,562 Z" fill="#2F6FA8"/>
    <path d="M70,654 C71.5,667 68.5,685 70,698" stroke="#2F6FA8" stroke-width="2" fill="none"/>
    <path d="M62,698 L78,699 L70,706 Z" fill="#2F6FA8"/>
    <path d="M70,798 C71.5,811 68.5,829 70,842" stroke="#2F6FA8" stroke-width="2" fill="none"/>
    <path d="M62,842 L78,843 L70,850 Z" fill="#2F6FA8"/>

    <!-- 主流程实心编号圆（强调色 + 白字） -->
    <circle cx="70" cy="176" r="10" fill="#2F6FA8" stroke="#245A87" stroke-width="1.5"/>
    <circle cx="70" cy="320" r="10" fill="#2F6FA8" stroke="#245A87" stroke-width="1.5"/>
    <circle cx="70" cy="464" r="10" fill="#2F6FA8" stroke="#245A87" stroke-width="1.5"/>
    <circle cx="70" cy="608" r="10" fill="#2F6FA8" stroke="#245A87" stroke-width="1.5"/>
    <circle cx="70" cy="752" r="10" fill="#2F6FA8" stroke="#245A87" stroke-width="1.5"/>
    <circle cx="70" cy="896" r="10" fill="#2F6FA8" stroke="#245A87" stroke-width="1.5"/>
  </g>

  <!-- ================= 文字组（无滤镜） ================= -->
  <g class="text">
    <!-- 大标题 + 英文副标 -->
    <text x="550" y="46" font-size="30" text-anchor="middle" fill="#3B3A36">机器学习发展图</text>
    <text x="550" y="78" font-size="13" text-anchor="middle" fill="#3B3A36" fill-opacity="0.75">Machine Learning Development Timeline</text>

    <!-- 层标题（结构色描边档 + 英文副标） -->
    <text x="92" y="158" font-size="15.5" fill="#A8967A">1950s · 起步期<tspan font-size="11.5" fill="#3B3A36" fill-opacity="0.75">  The Dawn</tspan></text>
    <text x="92" y="302" font-size="15.5" fill="#A8967A">1960s-70s · 探索与寒冬<tspan font-size="11.5" fill="#3B3A36" fill-opacity="0.75">  AI Winter</tspan></text>
    <text x="92" y="446" font-size="15.5" fill="#A8967A">1980s · 复苏期<tspan font-size="11.5" fill="#3B3A36" fill-opacity="0.75">  Renaissance</tspan></text>
    <text x="92" y="590" font-size="15.5" fill="#8C9AA3">1990s · 统计学习<tspan font-size="11.5" fill="#3B3A36" fill-opacity="0.75">  Statistical Learning</tspan></text>
    <text x="92" y="734" font-size="15.5" fill="#8C9AA3">2010s · 深度学习爆发<tspan font-size="11.5" fill="#3B3A36" fill-opacity="0.75">  Deep Learning</tspan></text>
    <text x="92" y="878" font-size="15.5" fill="#2F6FA8">2020s · 大模型时代<tspan font-size="11.5" fill="#3B3A36" fill-opacity="0.75">  LLM Era</tspan></text>

    <!-- C1 里程碑 -->
    <text x="106" y="192" font-size="10" font-weight="700" fill="#A8967A">1950</text>
    <text x="106" y="203" font-size="12" fill="#3B3A36">图灵测试</text>
    <text x="280" y="192" font-size="10" font-weight="700" fill="#A8967A">1957</text>
    <text x="280" y="203" font-size="12" fill="#3B3A36">感知机</text>
    <text x="444" y="192" font-size="10" font-weight="700" fill="#A8967A">1958</text>
    <text x="444" y="203" font-size="12" fill="#3B3A36">早期神经网络</text>
    <!-- C2 里程碑 -->
    <text x="106" y="336" font-size="10" font-weight="700" fill="#A8967A">1969</text>
    <text x="106" y="347" font-size="12" fill="#3B3A36">感知机遇冷</text>
    <text x="285" y="336" font-size="10" font-weight="700" fill="#A8967A">1974</text>
    <text x="285" y="347" font-size="12" fill="#3B3A36">第一次AI寒冬</text>
    <text x="484" y="336" font-size="10" font-weight="700" fill="#A8967A">1970s</text>
    <text x="484" y="347" font-size="12" fill="#3B3A36">专家系统</text>
    <!-- C3 里程碑 -->
    <text x="106" y="480" font-size="10" font-weight="700" fill="#A8967A">1986</text>
    <text x="106" y="491" font-size="12" fill="#3B3A36">反向传播</text>
    <text x="280" y="480" font-size="10" font-weight="700" fill="#A8967A">1987</text>
    <text x="280" y="491" font-size="12" fill="#3B3A36">卷积网络CNN</text>
    <text x="474" y="480" font-size="10" font-weight="700" fill="#A8967A">1980s</text>
    <text x="474" y="491" font-size="12" fill="#3B3A36">知识工程</text>
    <!-- C4 里程碑 -->
    <text x="106" y="624" font-size="10" font-weight="700" fill="#8C9AA3">1995</text>
    <text x="106" y="635" font-size="12" fill="#3B3A36">支持向量机SVM</text>
    <text x="305" y="624" font-size="10" font-weight="700" fill="#8C9AA3">1995</text>
    <text x="305" y="635" font-size="12" fill="#3B3A36">AdaBoost集成</text>
    <text x="489" y="624" font-size="10" font-weight="700" fill="#8C9AA3">1997</text>
    <text x="489" y="635" font-size="12" fill="#3B3A36">深蓝战胜棋王</text>
    <!-- C5 里程碑 -->
    <text x="106" y="768" font-size="10" font-weight="700" fill="#8C9AA3">2012</text>
    <text x="106" y="779" font-size="12" fill="#3B3A36">AlexNet夺冠</text>
    <text x="290" y="768" font-size="10" font-weight="700" fill="#8C9AA3">2014</text>
    <text x="290" y="779" font-size="12" fill="#3B3A36">GAN生成对抗</text>
    <text x="479" y="768" font-size="10" font-weight="700" fill="#8C9AA3">2016</text>
    <text x="479" y="779" font-size="12" fill="#3B3A36">AlphaGo</text>
    <text x="653" y="768" font-size="10" font-weight="700" fill="#8C9AA3">2017</text>
    <text x="653" y="779" font-size="12" fill="#3B3A36">Transformer</text>
    <!-- C6 里程碑 -->
    <text x="106" y="912" font-size="10" font-weight="700" fill="#2F6FA8">2020</text>
    <text x="106" y="923" font-size="12" fill="#3B3A36">GPT-3涌现</text>
    <text x="285" y="912" font-size="10" font-weight="700" fill="#2F6FA8">2022</text>
    <text x="285" y="923" font-size="12" fill="#3B3A36">ChatGPT浪潮</text>
    <text x="479" y="912" font-size="10" font-weight="700" fill="#2F6FA8">2024</text>
    <text x="479" y="923" font-size="12" fill="#3B3A36">多模态智能体</text>

    <!-- 编号圆内数字（白字） -->
    <text x="70" y="180" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="70" y="324" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="70" y="468" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="70" y="612" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="70" y="756" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
    <text x="70" y="900" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  </g>
</svg>
