    <text x="88" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <circle cx="100" cy="520" r="11" fill="#DB9066" stroke="#C07B48" stroke-width="1.6"/>
    <text x="100" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <circle cx="620" cy="380" r="11" fill="#94a3b8" stroke="#64748b" stroke-width="1.6"/>
    <text x="620" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
    <circle cx="975" cy="420" r="11" fill="#94a3b8" stroke="#64748b" stroke-width="1.6"/>
    <text x="975" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text>
    <circle cx="480" cy="200" r="11" fill="#94a3b8" stroke="#64748b" stroke-width="1.6"/>
    <text x="480" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">8</text>
    <circle cx="385" cy="272" r="10" fill="none" stroke="#DB9066" stroke-width="2"/>
    <text x="385" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#C07B48">1</text>
    <circle cx="655" cy="272" r="10" fill="none" stroke="#DB9066" stroke-width="2"/>
