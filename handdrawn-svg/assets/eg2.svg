    <rect x="200" y="676" width="720" height="90" rx="14" fill="none" stroke="#F4D58C" stroke-width="1.6"/>
    <rect x="200" y="798" width="720" height="90" rx="14" fill="none" stroke="#A5DCDB" stroke-width="1.6"/>
    <rect x="1016" y="90" width="74" height="798" rx="10" fill="none" stroke="#F2A9B8" stroke-width="1.6"/>
  </g>

  <!-- 连接线组（不使用任何滤镜；主流程实线 / 返回与辅助虚线；弯折处圆角） -->
  <g class="shapes">
    <!-- ① 用户请求 -->
    <path d="M235,164 L235,188 M235,212 L235,254" fill="none" stroke="#DB9066" stroke-width="2.2"/>
    <path d="M229,246 L241,248 L235,258 Z" fill="#DB9066"/>
    <!-- ② 推理请求 -->
    <path d="M520,314 L520,368 M520,392 L520,418" fill="none" stroke="#DB9066" stroke-width="2.2"/>
    <path d="M514,420 L526,422 L520,432 Z" fill="#DB9066"/>
    <!-- ③ 工具调用 -->
    <path d="M898,279 L948,279 Q952,279 952,283 L952,467 M952,493 L952,580 Q952,584 948,584 L906,584" fill="none" stroke="#DB9066" stroke-width="2.2"/>
    <path d="M912,577 L912,591 L904,584 Z" fill="#DB9066"/>
    <!-- ④ 知识检索（双向） -->
    <path d="M198,288 L92,288 Q88,288 88,292 L88,542 M88,568 L88,844 Q88,848 92,848 L276,848" fill="none" stroke="#DB9066" stroke-width="2.2"/>
    <path d="M192,281 L192,295 L200,288 Z" fill="#DB9066"/>
    <path d="M288,841 L288,855 L280,848 Z" fill="#DB9066"/>
    <!-- ⑤ 记忆读写（双向） -->
    <path d="M198,340 L104,340 Q100,340 100,344 L100,507 M100,533 L100,728 Q100,732 104,732 L276,732" fill="none" stroke="#DB9066" stroke-width="2.2"/>
    <path d="M192,333 L192,347 L200,340 Z" fill="#DB9066"/>
    <path d="M288,725 L288,739 L280,732 Z" fill="#DB9066"/>
    <!-- ReAct 循环：思考 / 行动（空心编号） -->
    <path d="M412,287 L474,287" fill="none" stroke="#DB9066" stroke-width="2.2"/>
    <path d="M472,280 L472,294 L480,287 Z" fill="#DB9066"/>
    <path d="M682,287 L733,287" fill="none" stroke="#DB9066" stroke-width="2.2"/>
    <path d="M732,280 L732,294 L740,287 Z" fill="#DB9066"/>
    <!-- 观察反馈弧线（虚线，返回 ③） -->
    <path d="M778,256 C778,244 252,244 252,253" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,5"/>
    <path d="M244,246 L258,247 L251,258 Z" fill="#94a3b8"/>
    <!-- ⑥ 生成结果（返回） -->
    <path d="M620,434 L620,392 M620,368 L620,326" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7,6"/>
    <path d="M613,328 L627,327 L620,316 Z" fill="#94a3b8"/>
    <!-- ⑦ 工具结果（返回） -->
    <path d="M830,580 L830,567 Q830,563 834,563 L971,563 Q975,563 975,559 L975,407 M975,433 L975,295 Q975,291 971,291 L908,291" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7,6"/>
    <path d="M914,284 L914,298 L906,291 Z" fill="#94a3b8"/>
