<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&amp;family=Liu+Jian+Mao+Cao&amp;display=swap');
    .text { font-family: 'ZCOOL KuaiLe','Liu Jian Mao Cao','Kaiti SC','STKaiti','KaiTi','Comic Sans MS','Bradley Hand',cursive; }
    .shapes { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- 本次随机参数：色系=马卡龙；层色=天空蓝/蜜桃/淡紫(LLM实心)/薄荷绿/柠檬黄/淡青/樱花粉；纸色=#FBF7EC 奶油；seedA=41/scaleA=3.2/baseFreqA=0.058；seedB=97/scaleB=4.2/baseFreqB=0.052；排线=30°/0.14；箭头=#DB9066 蜜橙；返回虚线="7,6" 灰#94a3b8；装饰=星+螺旋+太阳+圆点；编号语义：实心=主流程 / 空心=循环内部 / 灰=返回辅助 -->
  <defs>
    <filter id="sketchA" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.058" numOctaves="3" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchB" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.052" numOctaves="3" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="paperDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#E0D5BC" opacity="0.5"/>
    </pattern>
    <pattern id="hatch_blue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6E9ECB" stroke-width="1" opacity="0.14"/>
    </pattern>
    <pattern id="hatch_peach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#DB9066" stroke-width="1" opacity="0.14"/>
    </pattern>
    <pattern id="hatch_mint" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6FB39B" stroke-width="1" opacity="0.14"/>
    </pattern>
    <pattern id="hatch_lemon" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D9AE4E" stroke-width="1" opacity="0.14"/>
    </pattern>
    <pattern id="hatch_aqua" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6EB5B4" stroke-width="1" opacity="0.14"/>
    </pattern>
    <pattern id="hatch_pink" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D9738A" stroke-width="1" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- 纸张背景 -->
  <rect width="1100" height="960" fill="#FBF7EC"/>
  <rect width="1100" height="960" fill="url(#paperDots)"/>

  <!-- 形状组（矩形 / 小块 / 涂鸦装饰，含抖动滤镜；不含连接线） -->
  <g filter="url(#sketchA)" class="shapes">
    <!-- 用户层 -->
    <rect x="200" y="90" width="720" height="94" rx="14" fill="#ECF4FB"/>
    <rect x="200" y="90" width="720" height="94" rx="14" fill="url(#hatch_blue)"/>
    <rect x="200" y="90" width="720" height="94" rx="14" fill="none" stroke="#A9CBE8" stroke-width="3"/>
    <rect x="214" y="124" width="190" height="42" rx="8" fill="#fffdf7" stroke="#D2E4F3" stroke-width="2"/>
    <rect x="460" y="124" width="210" height="42" rx="8" fill="#fffdf7" stroke="#D2E4F3" stroke-width="2"/>
    <rect x="726" y="124" width="182" height="42" rx="8" fill="#fffdf7" stroke="#D2E4F3" stroke-width="2"/>
    <!-- 编排层 -->
    <rect x="200" y="216" width="720" height="148" rx="14" fill="#FEF1E8"/>
    <rect x="200" y="216" width="720" height="148" rx="14" fill="url(#hatch_peach)"/>
    <rect x="200" y="216" width="720" height="148" rx="14" fill="none" stroke="#F5C3A8" stroke-width="3"/>
    <rect x="214" y="258" width="200" height="58" rx="8" fill="#fffdf7" stroke="#FAE0CE" stroke-width="2"/>
    <rect x="480" y="258" width="200" height="58" rx="8" fill="#fffdf7" stroke="#FAE0CE" stroke-width="2"/>
    <rect x="740" y="258" width="166" height="58" rx="8" fill="#fffdf7" stroke="#FAE0CE" stroke-width="2"/>
    <!-- 模型层（LLM 块实心） -->
    <rect x="200" y="396" width="720" height="106" rx="14" fill="#F4EFFA"/>
    <rect x="200" y="396" width="720" height="106" rx="14" fill="none" stroke="#C7B4E3" stroke-width="3"/>
    <rect x="360" y="432" width="400" height="50" rx="10" fill="#C7B4E3" stroke="#9678C0" stroke-width="2.5"/>
    <!-- 工具层 -->
    <rect x="200" y="534" width="720" height="110" rx="14" fill="#EBF7F2"/>
    <rect x="200" y="534" width="720" height="110" rx="14" fill="url(#hatch_mint)"/>
    <rect x="200" y="534" width="720" height="110" rx="14" fill="none" stroke="#A8D8C5" stroke-width="3"/>
    <rect x="214" y="576" width="150" height="46" rx="8" fill="#fffdf7" stroke="#CEEADF" stroke-width="2"/>
    <rect x="394" y="576" width="150" height="46" rx="8" fill="#fffdf7" stroke="#CEEADF" stroke-width="2"/>
    <rect x="574" y="576" width="150" height="46" rx="8" fill="#fffdf7" stroke="#CEEADF" stroke-width="2"/>
    <rect x="754" y="576" width="150" height="46" rx="8" fill="#fffdf7" stroke="#CEEADF" stroke-width="2"/>
    <!-- 记忆层 -->
    <rect x="200" y="676" width="720" height="90" rx="14" fill="#FEF7E4"/>
    <rect x="200" y="676" width="720" height="90" rx="14" fill="url(#hatch_lemon)"/>
    <rect x="200" y="676" width="720" height="90" rx="14" fill="none" stroke="#F4D58C" stroke-width="3"/>
    <rect x="280" y="710" width="250" height="44" rx="8" fill="#fffdf7" stroke="#FAE9BE" stroke-width="2"/>
    <rect x="600" y="710" width="280" height="44" rx="8" fill="#fffdf7" stroke="#FAE9BE" stroke-width="2"/>
    <!-- 知识层 -->
    <rect x="200" y="798" width="720" height="90" rx="14" fill="#ECF8F7"/>
    <rect x="200" y="798" width="720" height="90" rx="14" fill="url(#hatch_aqua)"/>
    <rect x="200" y="798" width="720" height="90" rx="14" fill="none" stroke="#A5DCDB" stroke-width="3"/>
    <rect x="280" y="832" width="250" height="44" rx="8" fill="#fffdf7" stroke="#D1EEED" stroke-width="2"/>
    <rect x="600" y="832" width="280" height="44" rx="8" fill="#fffdf7" stroke="#D1EEED" stroke-width="2"/>
    <!-- 安全层（右侧竖带） -->
    <rect x="1016" y="90" width="74" height="798" rx="10" fill="#FDECEF"/>
    <rect x="1016" y="90" width="74" height="798" rx="10" fill="url(#hatch_pink)"/>
    <rect x="1016" y="90" width="74" height="798" rx="10" fill="none" stroke="#F2A9B8" stroke-width="3"/>
    <rect x="1024" y="160" width="58" height="46" rx="8" fill="#fffdf7" stroke="#F8CDD5" stroke-width="2"/>
    <rect x="1024" y="380" width="58" height="46" rx="8" fill="#fffdf7" stroke="#F8CDD5" stroke-width="2"/>
    <rect x="1024" y="600" width="58" height="46" rx="8" fill="#fffdf7" stroke="#F8CDD5" stroke-width="2"/>
    <!-- 涂鸦装饰 -->
    <path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12 Z" transform="translate(70,58) scale(1.2)" fill="#f472b6" opacity="0.85"/>
    <circle cx="58" cy="100" r="5" fill="#a78bfa" opacity="0.7"/>
    <path d="M62,918 m0,0 c3.6,-5.4 10.8,-3.6 11.7,1.8 c0.9,5.4 -5.4,8.1 -9.9,4.5 c-3.6,-2.7 -3.6,-8.1 0.9,-9.9 c3.6,-1.8 7.2,0.9 6.3,4.5" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <g transform="translate(1050,915)">
      <circle r="7" fill="#fbbf24"/>
      <path d="M0,-11 L0,-8 M0,11 L0,8 M-11,0 L-8,0 M11,0 L8,0 M-8,-8 L-6,-6 M8,8 L6,6 M8,-8 L6,-6 M-8,8 L-6,6" stroke="#fbbf24" stroke-width="1.8" fill="none"/>
    </g>
  </g>

  <!-- 描边组（大容器第二遍描边，与第一遍错开形成叠线） -->
  <g filter="url(#sketchB)" class="shapes">
    <rect x="200" y="90" width="720" height="94" rx="14" fill="none" stroke="#A9CBE8" stroke-width="1.6"/>
    <rect x="200" y="216" width="720" height="148" rx="14" fill="none" stroke="#F5C3A8" stroke-width="1.6"/>
    <rect x="200" y="396" width="720" height="106" rx="14" fill="none" stroke="#C7B4E3" stroke-width="1.6"/>
