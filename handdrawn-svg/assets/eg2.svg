    <path d="M1016,183 L924,183" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7,6"/>
    <path d="M928,176 L928,190 L920,183 Z" fill="#94a3b8"/>
    <path d="M1016,403 L924,403" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7,6"/>
    <path d="M928,396 L928,410 L920,403 Z" fill="#94a3b8"/>
    <path d="M1016,623 L924,623" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7,6"/>
    <path d="M928,616 L928,630 L920,623 Z" fill="#94a3b8"/>
    <!-- 编号圆圈：实心=主流程 / 空心=循环内部 / 灰=返回辅助 -->
    <circle cx="235" cy="200" r="11" fill="#DB9066" stroke="#C07B48" stroke-width="1.6"/>
    <text x="235" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <circle cx="520" cy="380" r="11" fill="#DB9066" stroke="#C07B48" stroke-width="1.6"/>
    <text x="520" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
