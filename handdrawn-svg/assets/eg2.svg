    <path d="M480,216 L480,188 M480,212 L480,170" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7,6"/>
    <path d="M474,178 L486,176 L480,166 Z" fill="#94a3b8"/>
