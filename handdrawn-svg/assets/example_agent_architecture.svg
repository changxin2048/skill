    <text x="594" y="298" font-size="13" font-weight="700" fill="#1e293b">工具调用</text>
    <text x="594" y="315" font-size="10" fill="#64748b">选择 / 执行</text>
    <text x="742" y="298" font-size="13" font-weight="700" fill="#1e293b">反思自省</text>
