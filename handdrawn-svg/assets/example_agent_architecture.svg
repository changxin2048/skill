    <text x="492" y="592" text-anchor="end" font-size="11" fill="#94a3b8">结果返回</text>
    <text x="268" y="220" font-size="11" fill="#94a3b8">汇总回复</text>

    <!-- 流程编号 -->
    <ellipse cx="556" cy="206" rx="11" ry="11" fill="none" stroke="#f59e0b" stroke-width="2" class="shapes"/>
