    <text x="870" y="681" text-anchor="middle" font-size="10" fill="#64748b">企业资料 · 手册 · 规范</text>
    <text x="870" y="716" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">RAG 检索增强</text>
