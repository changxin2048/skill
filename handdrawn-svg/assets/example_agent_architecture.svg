    <text x="280" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="428" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="576" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="724" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
