<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&amp;family=Liu+Jian+Mao+Cao&amp;display=swap');
    .text { font-family: 'ZCOOL KuaiLe','Liu Jian Mao Cao','Kaiti SC','STKaiti','KaiTi','Comic Sans MS','Bradley Hand',cursive; }
    .shapes { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <!-- 抖动滤镜：让所有图形边缘“手抖” -->
    <filter id="sketchA" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchB" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 网格纸点阵 -->
    <pattern id="paperDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#cbbfa9" opacity="0.5"/>
    </pattern>
    <!-- 铅笔排线 -->
    <pattern id="hatchSky"  width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#0369a1" stroke-width="1" opacity="0.16"/></pattern>
    <pattern id="hatchIndigo" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#4338ca" stroke-width="1" opacity="0.14"/></pattern>
    <pattern id="hatchGreen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#047857" stroke-width="1" opacity="0.15"/></pattern>
    <pattern id="hatchAmber" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#b45309" stroke-width="1" opacity="0.15"/></pattern>
    <pattern id="hatchCyan"  width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#0e7490" stroke-width="1" opacity="0.15"/></pattern>
    <pattern id="hatchSlate" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#475569" stroke-width="1" opacity="0.12"/></pattern>
  </defs>

  <!-- ============ 纸张背景 ============ -->
  <rect width="1100" height="960" fill="#fbf7ee"/>
  <rect width="1100" height="960" fill="url(#paperDots)"/>

  <!-- ============ 标题（手写体，微旋转） ============ -->
  <g>
    <text x="550" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#403a2e" class="text">智能体（AI Agent）系统架构图</text>
    <text x="550" y="72" text-anchor="middle" font-size="14" fill="#8a7f6f" class="text">Agent Architecture — 用户交互 · 智能编排 · 大模型推理 · 工具 / 记忆 / 知识支撑</text>
  </g>

  <!-- ============ 图形组（全部过抖动滤镜） ============ -->
  <g filter="url(#sketchA)" class="shapes">
    <!-- 标题下划线波浪 -->
    <path d="M330,60 C370,53 410,67 450,60 C490,53 530,67 570,60 C610,53 650,67 690,60 C730,53 770,67 810,60" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- 小星星涂鸦 -->
    <path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12 Z" transform="translate(150,115) scale(1.1)" fill="#f472b6" opacity="0.85"/>
    <path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12 Z" transform="translate(938,108) scale(0.9)" fill="#fbbf24" opacity="0.9"/>
    <path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12 Z" transform="translate(250,560) scale(0.8)" fill="#22d3ee" opacity="0.8"/>
    <path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12 Z" transform="translate(1010,470) scale(0.7)" fill="#f472b6" opacity="0.7"/>

    <!-- ====== 第1层 用户交互层 ====== -->
    <g>
      <rect x="250" y="96" width="600" height="100" rx="14" fill="#dff3ff"/>
      <rect x="250" y="96" width="600" height="100" rx="14" fill="url(#hatchSky)"/>
      <rect x="250" y="96" width="600" height="100" rx="14" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <rect x="250" y="96" width="600" height="100" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1.6"/>
      <rect x="272" y="134" width="172" height="42" rx="9" fill="#fffdf7" stroke="#7dd3fc" stroke-width="2"/>
      <rect x="464" y="134" width="172" height="42" rx="9" fill="#fffdf7" stroke="#7dd3fc" stroke-width="2"/>
      <rect x="656" y="134" width="172" height="42" rx="9" fill="#fffdf7" stroke="#7dd3fc" stroke-width="2"/>
    </g>

    <!-- ====== 第2层 智能体编排层 ====== -->
    <g>
      <rect x="250" y="234" width="600" height="196" rx="14" fill="#eef1ff"/>
      <rect x="250" y="234" width="600" height="196" rx="14" fill="url(#hatchIndigo)"/>
      <rect x="250" y="234" width="600" height="196" rx="14" fill="none" stroke="#818cf8" stroke-width="3"/>
      <rect x="250" y="234" width="600" height="196" rx="14" fill="none" stroke="#6366f1" stroke-width="1.6"/>
      <line x1="270" y1="356" x2="830" y2="356" stroke="#c7d2fe" stroke-width="1.6" stroke-dasharray="7,5"/>
      <rect x="261" y="272" width="134" height="70" rx="10" fill="#fffdf7" stroke="#a5b4fc" stroke-width="2"/>
      <rect x="409" y="272" width="134" height="70" rx="10" fill="#fffdf7" stroke="#a5b4fc" stroke-width="2"/>
      <rect x="557" y="272" width="134" height="70" rx="10" fill="#fffdf7" stroke="#a5b4fc" stroke-width="2"/>
      <rect x="705" y="272" width="134" height="70" rx="10" fill="#fffdf7" stroke="#a5b4fc" stroke-width="2"/>
      <ellipse cx="280" cy="294" rx="12" ry="12" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
      <ellipse cx="428" cy="294" rx="12" ry="12" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
      <ellipse cx="576" cy="294" rx="12" ry="12" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
      <ellipse cx="724" cy="294" rx="12" ry="12" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
    </g>

    <!-- ====== 第3层 大语言模型 ====== -->
    <g>
      <rect x="330" y="468" width="440" height="72" rx="15" fill="#8b5cf6"/>
      <rect x="330" y="468" width="440" height="72" rx="15" fill="none" stroke="#6d28d9" stroke-width="3.5"/>
      <rect x="330" y="468" width="440" height="72" rx="15" fill="none" stroke="#4c1d95" stroke-width="1.8"/>
      <path d="M430,532 C460,527 480,537 510,532 C540,527 560,537 590,532 C620,527 640,537 670,532" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    </g>

    <!-- ====== 连接线 ====== -->
    <!-- ① 用户请求 -->
    <path d="M550,198 C547,208 553,222 550,233" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <path d="M543,232 L557,234 L550,244 Z" fill="#f59e0b"/>
    <!-- ② 推理请求 -->
    <path d="M550,432 C547,442 553,456 550,466" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <path d="M543,464 L557,466 L550,476 Z" fill="#f59e0b"/>
    <!-- ③ 分支到工具/记忆/知识 -->
    <path d="M550,542 C547,554 553,564 550,574 C547,582 553,598 550,606" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <path d="M550,542 C547,554 553,564 550,574 L230,574 C224,576 224,580 230,582 L230,606" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <path d="M550,542 C547,554 553,564 550,574 L870,574 C876,576 876,580 870,582 L870,606" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <path d="M223,604 L237,606 L230,616 Z" fill="#f59e0b"/>
    <path d="M543,604 L557,606 L550,616 Z" fill="#f59e0b"/>
    <path d="M863,604 L877,606 L870,616 Z" fill="#f59e0b"/>
    <!-- ④ 结果返回（虚线） -->
    <path d="M200,604 C199,588 201,562 200,550" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7,6"/>
    <path d="M193,551 L207,553 L200,542 Z" fill="#94a3b8"/>
    <path d="M520,604 C519,588 521,562 520,550" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7,6"/>
    <path d="M513,551 L527,553 L520,542 Z" fill="#94a3b8"/>
    <path d="M840,604 C839,588 841,562 840,550" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7,6"/>
    <path d="M833,551 L847,553 L840,542 Z" fill="#94a3b8"/>
    <!-- ⑤ 汇总回复 -->
    <path d="M520,470 C519,458 521,446 520,436 L258,436 C254,436 254,432 258,432 L258,196" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7,6"/>
    <path d="M251,197 L265,199 L258,187 Z" fill="#94a3b8"/>

    <!-- ====== 第4层 工具层 ====== -->
    <g>
      <rect x="80" y="606" width="300" height="230" rx="14" fill="#e9fbf1"/>
      <rect x="80" y="606" width="300" height="230" rx="14" fill="url(#hatchGreen)"/>
      <rect x="80" y="606" width="300" height="230" rx="14" fill="none" stroke="#10b981" stroke-width="3"/>
      <rect x="80" y="606" width="300" height="230" rx="14" fill="none" stroke="#059669" stroke-width="1.6"/>
      <rect x="94" y="648" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a7f3d0" stroke-width="2"/>
      <rect x="94" y="696" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a7f3d0" stroke-width="2"/>
      <rect x="94" y="744" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a7f3d0" stroke-width="2"/>
      <rect x="94" y="792" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a7f3d0" stroke-width="2"/>
    </g>

    <!-- ====== 第4层 记忆层 ====== -->
    <g>
      <rect x="400" y="606" width="300" height="230" rx="14" fill="#fef6e4"/>
      <rect x="400" y="606" width="300" height="230" rx="14" fill="url(#hatchAmber)"/>
      <rect x="400" y="606" width="300" height="230" rx="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <rect x="400" y="606" width="300" height="230" rx="14" fill="none" stroke="#d97706" stroke-width="1.6"/>
      <rect x="414" y="648" width="272" height="38" rx="8" fill="#fffdf7" stroke="#fde68a" stroke-width="2"/>
      <rect x="414" y="696" width="272" height="38" rx="8" fill="#fffdf7" stroke="#fde68a" stroke-width="2"/>
      <rect x="414" y="744" width="272" height="38" rx="8" fill="#fffdf7" stroke="#fde68a" stroke-width="2"/>
      <rect x="414" y="792" width="272" height="38" rx="8" fill="#fffdf7" stroke="#fde68a" stroke-width="2"/>
    </g>

    <!-- ====== 第4层 知识层 ====== -->
    <g>
      <rect x="720" y="606" width="300" height="230" rx="14" fill="#e7fbfe"/>
      <rect x="720" y="606" width="300" height="230" rx="14" fill="url(#hatchCyan)"/>
      <rect x="720" y="606" width="300" height="230" rx="14" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <rect x="720" y="606" width="300" height="230" rx="14" fill="none" stroke="#0891b2" stroke-width="1.6"/>
      <rect x="734" y="648" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a5f3fc" stroke-width="2"/>
      <rect x="734" y="696" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a5f3fc" stroke-width="2"/>
      <rect x="734" y="744" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a5f3fc" stroke-width="2"/>
      <rect x="734" y="792" width="272" height="38" rx="8" fill="#fffdf7" stroke="#a5f3fc" stroke-width="2"/>
    </g>

    <!-- ====== 安全与治理 ====== -->
    <g>
      <path d="M550,838 C549,846 551,852 550,860" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7,6"/>
      <rect x="80" y="862" width="940" height="56" rx="14" fill="#f4f1ea"/>
      <rect x="80" y="862" width="940" height="56" rx="14" fill="url(#hatchSlate)"/>
      <rect x="80" y="862" width="940" height="56" rx="14" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="9,7"/>
    </g>
  </g>

  <!-- ============ 文字组（无滤镜，保证可读） ============ -->
  <g class="text">
    <!-- 用户交互层 -->
    <text x="268" y="124" font-size="16" font-weight="700" fill="#0369a1">用户交互层 <tspan font-size="12" font-weight="400" fill="#0284c7" opacity="0.75">User Interface</tspan></text>
    <text x="358" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Web / App</text>
    <text x="358" y="174" text-anchor="middle" font-size="10.5" fill="#64748b">网页 / 移动端</text>
    <text x="550" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">API / CLI</text>
    <text x="550" y="174" text-anchor="middle" font-size="10.5" fill="#64748b">接口 / 命令行</text>
    <text x="742" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">语音 / 多模态</text>
    <text x="742" y="174" text-anchor="middle" font-size="10.5" fill="#64748b">语音输入 / 图像理解</text>

    <!-- 智能体编排层 -->
    <text x="268" y="262" font-size="16" font-weight="700" fill="#4338ca">智能体编排层 <tspan font-size="12" font-weight="400" fill="#6366f1" opacity="0.75">Agent Orchestrator</tspan></text>
    <text x="298" y="298" font-size="13" font-weight="700" fill="#1e293b">任务规划</text>
    <text x="298" y="315" font-size="10" fill="#64748b">拆解 / 编排</text>
