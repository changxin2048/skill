    <text x="230" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">网页搜索</text>
    <text x="230" y="681" text-anchor="middle" font-size="10" fill="#64748b">Web Search · 新闻 / 百科</text>
