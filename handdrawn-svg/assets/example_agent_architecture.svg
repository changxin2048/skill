    <!-- 大语言模型 -->
    <text x="550" y="505" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">大语言模型 LLM</text>
    <text x="550" y="527" text-anchor="middle" font-size="12.5" fill="#e9d5ff">推理 · 规划 · 生成 · 决策</text>

    <!-- 连接线说明 -->
    <text x="562" y="222" font-size="11" fill="#b45309">用户请求</text>
    <text x="562" y="456" font-size="11" fill="#b45309">推理请求</text>
    <text x="240" y="594" font-size="11" fill="#b45309">调用工具</text>
